        .card { background: var(--card-bg); border-radius: 20px; padding: 20px; margin-top: 20px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
        .hidden { display: none; }

        .login-brand { text-align: center; margin-bottom: 20px; }
        .login-brand img { width: 120px; margin-bottom: 10px; }
        .security-banner { background: #f0f4ff; border-left: 4px solid var(--primary); padding: 12px; border-radius: 8px; font-size: 11px; color: #1e293b; margin-bottom: 20px; line-height: 1.4; }

        input, select, button { width: 100%; padding: 14px; margin-top: 12px; border-radius: 12px; border: 1.5px solid #e2e8f0; font-size: 16px; outline: none; transition: 0.3s; box-sizing: border-box; }

        button { background: var(--primary); color: white; border: none; font-weight: 700; cursor: pointer; text-transform: uppercase; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        
        .balanceCard { background: linear-gradient(135deg, #1e293b, #334155); color: white; border-radius: 24px; padding: 25px; position: relative; }
        .balance { font-size: 36px; font-weight: 800; }
        .eye { position: absolute; right: 25px; top: 25px; cursor: pointer; font-size: 20px; user-select: none; }

        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 20px; }
        .action-icon { background: white; padding: 10px; border-radius: 15px; text-align: center; font-size: 11px; font-weight: 600; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .action-icon img { width: 24px; height: 24px; margin-bottom: 5px; }

        #history { list-style: none; padding: 0; }
        #history li { padding: 12px 0; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; font-size: 13px; }
        
        .receipt-container { background: white; border-radius: 15px; padding: 0; overflow: hidden; border: 1px solid #e2e8f0; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        .receipt-header { background: #f8fafc; padding: 25px; text-align: center; border-bottom: 1px dashed #cbd5e1; }
        .receipt-body { padding: 25px; font-size: 14px; }
        .receipt-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f8fafc; }
        .receipt-row span { color: #64748b; font-weight: 500; }

        .success-badge { background: #dcfce7; color: #166534; padding: 6px 15px; border-radius: 20px; font-size: 12px; font-weight: bold; display: inline-block; margin-bottom: 15px; border: 1px solid #bbf7d0; }
        .receipt-footer { padding: 15px; background: #f8fafc; color: #94a3b8; font-size: 10px; text-align: center; line-height: 1.4; border-top: 1px solid #f1f5f9; }

    function getTranslationDictionary(countryCode) {
        if (langData[countryCode]) return langData[countryCode];
        const customRoutingMatrix = { es: 'es', ar: 'es', do: 'es', ec: 'es', mx: 'es', pa: 'es', at: 'de', de: 'de', fr: 'fr', lu: 'fr', pt_eu: 'pt', pt: 'pt', it: 'it', jp: 'jp', tr: 'tr' };
        return langData[customRoutingMatrix[countryCode]] || langData['en'];
    }

    // connector mapping for "to" in different languages; used in the splash message
    function getConnector(countryCode) {
        const map = {
            en: 'to', id: 'ke', ms: 'ke', pt: 'para', es: 'a', fr: 'à', de: 'zu', it: 'a', jp: 'へ', ar: 'إلى', vn: 'đến', th: 'ถึง', ph: 'sa', pt_eu: 'para', gb: 'to'
        };
        return map[countryCode] || 'to';
    }

    function loadDropdownOptions() {
        const selector = document.getElementById("language");
        selector.innerHTML = "";
        countryDropdownOptions.forEach(opt => {
            const el = document.createElement("option");
            el.value = opt.code;
            el.innerText = `${opt.flag} ${opt.name}`;
            selector.appendChild(el);
        });
        setLanguage();
    }

    function updateTransferSelector() {
        const c = document.getElementById("language").value;
        const d = getTranslationDictionary(c);
        const tSelector = document.getElementById("transferCountry");
        const placeholder = document.getElementById("selectPlaceholder");
        
        placeholder.innerText = d.selectPlaceholder;
        
        // Remove old dynamic options
        while (tSelector.options.length > 1) {
            tSelector.remove(1);
        }
        
        countryDropdownOptions.forEach(opt => {
            const el = document.createElement("option");
            const translatedName = d.destNames[opt.name] || opt.name;
            el.value = translatedName;
            el.innerText = translatedName;
            tSelector.appendChild(el);
        });
    }

    function setLanguage() {
        const c = document.getElementById("language").value;
        const d = getTranslationDictionary(c);
        document.getElementById("mainHeader").innerText = d.head;
        document.getElementById("loginTitle").innerText = d.login;
        document.getElementById("username").placeholder = d.user;
        document.getElementById("password").placeholder = d.pass;
        document.getElementById("loginBtn").innerText = d.auth;
        document.getElementById("securityBanner").innerHTML = d.advisory;
        updateTransferSelector();
    }

    window.onload = loadDropdownOptions;

    function doLogin() {
        const selectedCountry = document.getElementById("language").value;
        const correctPin = countryPins[selectedCountry];
        const inputPin = document.getElementById("password").value;
        const d = getTranslationDictionary(selectedCountry);

        if(inputPin === correctPin) {
            loggedInUser = document.getElementById("username").value || "Valued Client";
            showLoadingOverlay(d.verifying);
            setTimeout(() => {
                removeLoadingOverlay();
                const splash = document.createElement("div");
                splash.style.cssText = "position:fixed; top:0; left:0; width:100%; height:100%; background:white; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:2000;";
                const connector = getConnector(selectedCountry);
                // make splash image circular and include bank name in selected language
                splash.innerHTML = `
                    <img src="https://raw.githubusercontent.com/de2408121-blip/Global-trust-bank-/92b29c799b66a1f4532527f69d950daff4d59c5f/e5b91344c3e4793e56fc7173130b646a.jpg" style="width:150px; height:150px; border-radius:50%; object-fit:cover;">
                    <p style="font-size:24px; font-weight:600; color:#1e293b; margin-top:18px;">${d.welcome} ${loggedInUser} ${connector} ${d.head}</p>
                `;
                document.body.appendChild(splash);
                setTimeout(() => {
                    splash.remove();
                    document.getElementById("login").classList.add("hidden");
                    document.getElementById("dashboard").classList.remove("hidden");
                    document.getElementById("welcomeText").innerText = `${d.welcome}, ${loggedInUser}`;
                    document.getElementById("balance").innerText = "$" + balance.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
                    applyDashboardLang();
                    loadHistory();
                }, 3000); 
            }, 2500); 
        } else { alert("Invalid PIN for this region."); }
    }

    function applyDashboardLang() {
        const c = document.getElementById("language").value;
        const d = getTranslationDictionary(c);
        document.getElementById("navTransfer").innerText = d.transfer;
        document.getElementById("navDeposit").innerText = d.save;
        document.getElementById("navWithdraw").innerText = d.cash;
        document.getElementById("navExit").innerText = d.exit;
        document.getElementById("tTitle").innerText = d.transfer;
        document.getElementById("hTitle").innerText = d.history;
        document.getElementById("receiver").placeholder = d.beneficiary;
        document.getElementById("accountNum").placeholder = d.accNum;
        document.getElementById("bank").placeholder = d.bank;
        document.getElementById("amount").placeholder = d.amt;
        document.getElementById("btnInitiate").innerText = d.initiate;
        document.getElementById("helpText").innerText = d.help;
    }

    function getFormattedDate(dateObj) {
        let year = dateObj.getFullYear();
        let month = String(dateObj.getMonth() + 1).padStart(2, '0');
        let day = String(dateObj.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    function getFormattedDateTime(dateObj) {
        let year = dateObj.getFullYear();
        let month = String(dateObj.getMonth() + 1).padStart(2, '0');
        let day = String(dateObj.getDate()).padStart(2, '0');
        let hours = dateObj.getHours();
        let minutes = String(dateObj.getMinutes()).padStart(2, '0');
        let ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12; hours = hours ? hours : 12; 
        return `${month}/${day}/${year} ${String(hours).padStart(2, '0')}:${minutes} ${ampm}`;
    }

    function loadHistory() {
        const c = document.getElementById("language").value;
        const list = document.getElementById("history");
        list.innerHTML = "";
        const d1 = new Date(2020, 5, 7);
        const d2 = new Date(2020, 5, 5);
        const d3 = new Date(2020, 5, 3);
        const d4 = new Date(2020, 5, 1);
        const regionalHistory = {
            en: [{n:"St. Jude Research", a:250000, d:getFormattedDate(d1)}, {n:"Red Cross Relief", a:150000, d:getFormattedDate(d2)}, {n:"UNICEF Foundation", a:100000, d:getFormattedDate(d3)}, {n:"World Health Fund", a:75000, d:getFormattedDate(d4)}],
            id: [{n:"RS Pusat Bandung", a:250000, d:getFormattedDate(d1)}, {n:"Masjid Raya Dago", a:150000, d:getFormattedDate(d2)}, {n:"Panti Asuhan Jabar", a:100000, d:getFormattedDate(d3)}, {n:"Yayasan Anak Negeri", a:75000, d:getFormattedDate(d4)}],
            ms: [{n:"Mercy Malaysia", a:250000, d:getFormattedDate(d1)}, {n:"Aman Palestine", a:150000, d:getFormattedDate(d2)}, {n:"Rumah Anak Yatim", a:100000, d:getFormattedDate(d3)}, {n:"Bantuan Masyarakat", a:75000, d:getFormattedDate(d4)}],
            pt: [{n:"AACD Reabilitação", a:250000, d:getFormattedDate(d1)}, {n:"Saúde Criança", a:150000, d:getFormattedDate(d2)}, {n:"Gerando Falcões", a:100000, d:getFormattedDate(d3)}, {n:"Ajude Brasil", a:75000, d:getFormattedDate(d4)}],
            th: [{n:"โรงพยาบาลศิริราช", a:250000, d:getFormattedDate(d1)}, {n:"มูลนิธิกระจกเงา", a:150000, d:getFormattedDate(d2)}, {n:"มูลนิธิเพื่อเด็ก", a:100000, d:getFormattedDate(d3)}, {n:"องค์กรสงเคราะห์", a:75000, d:getFormattedDate(d4)}]
        };
        const currentActiveLang = ['id','ms','pt','th'].includes(c) ? c : 'en';
        (regionalHistory[currentActiveLang] || regionalHistory['en']).forEach(item => {
            const li = document.createElement("li");
            li.innerHTML = `<div><small style="color:#94a3b8">${item.d}</small><br><strong>${item.n}</strong></div><span style="color:#e11d48">-$${item.a.toLocaleString()}</span>`;
            list.appendChild(li);
        });
    }

    function showBox(id) {
        document.getElementById("transferBox").classList.add("hidden");
        document.getElementById("receiptBox").classList.add("hidden");
        document.getElementById(id).classList.remove("hidden");
    }

    function preTransfer() {
        const c = document.getElementById("language").value;
        const d = getTranslationDictionary(c);
        const r = document.getElementById("receiver").value;
        const country = document.getElementById("transferCountry").value;
        const a_val = document.getElementById("amount").value;
        const a_numeric = parseFloat(a_val.replace(/,/g, ''));
        if(!r || !country || isNaN(a_numeric)) { alert("Check details"); return; }
        document.getElementById("transferPreview").innerHTML = `<div class="card" style="margin-top:10px; background:#f8fafc"><small>${d.confirm}: $${a_numeric.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</small><br><input id="tPin" type="password" placeholder="PIN" style="margin-top:10px;"><button onclick="finishTransfer(${a_numeric}, '${r}', '${country}')" style="margin-top:10px;">${d.initiate}</button></div>`;
    }

    function finishTransfer(amt, name, country) {
        const c = document.getElementById("language").value;
        const d = getTranslationDictionary(c);
        if(document.getElementById("tPin").value !== transferPin) { alert("Invalid PIN"); return; }
        
        showLoadingOverlay(d.processing);
        
        setTimeout(() => {
            removeLoadingOverlay();
            balance -= amt;
            document.getElementById("balance").innerText = balanceHidden ? "••••••••" : "$" + balance.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
            const now = new Date(); 
            const li = document.createElement("li");
            li.innerHTML = `<div><small style="color:#94a3b8">${getFormattedDate(now)}</small><br><strong>${name}</strong></div><span style="color:#e11d48">-$${amt.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</span>`;
            document.getElementById("history").prepend(li);
            document.getElementById("transferBox").classList.add("hidden");
            
            showNotification(d.successMsg(loggedInUser, amt.toLocaleString(), name));
            
            generateRealReceipt(name, amt, now, country);
        }, 3000); 
    }

    function generateRealReceipt(name, amt, timestampObj, country) {
        const c = document.getElementById("language").value;
        const d = getTranslationDictionary(c);
        const rBox = document.getElementById("receiptBox");
        const refNum = "GTB-" + Math.floor(Math.random() * 1000000000);
        rBox.classList.remove("hidden");
        rBox.innerHTML = `<div class="receipt-container"><div class="receipt-header"><img src="File_000000009678724680189a55ffec1a9b.png" style="width:45px; margin-bottom:8px; border-radius:50%; object-fit:cover;"><h4 style="margin:0; color:#0f172a;">${d.receiptTitle}</h4><p class="success-badge">${d.receiptSuccess}</p></div><div class="receipt-body"><div class="receipt-row"><span>${d.receiptRefNum}</span><b>${refNum}</b></div><div class="receipt-row"><span>${d.receiptDate}</span><b>${getFormattedDate(timestampObj)}</b></div><div class="receipt-row"><span>${d.receiptTime}</span><b>${getFormattedDateTime(timestampObj)}</b></div><div class="receipt-row"><span>${d.receiptFrom}</span><b>${loggedInUser}</b></div><div class="receipt-row"><span>${d.receiptTo}</span><b>${name}</b></div><div class="receipt-row" style="border:none;"><span>${d.receiptAmount}</span><b>$${amt.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</b></div></div><div class="receipt-footer">${d.receiptStatus}: ${d.receiptComplete}</div></div>`;
    }

    function toggleBalance() {
        balanceHidden = !balanceHidden;
        const balanceEl = document.getElementById("balance");
        const eyeEl = document.getElementById("eyeIcon");
        balanceEl.innerText = balanceHidden ? "••••••••" : "$" + balance.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
        eyeEl.innerText = balanceHidden ? "🙈" : "👁️";
    }
