<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Global Trust Bank | Private Wealth</title>
    <style>
        :root{--primary:#4f46e5;--dark-bg:#071033;--card-bg:#fff;--text:#0f172a}
        *{box-sizing:border-box}
        body{font-family:Inter, 'Segoe UI', Roboto, Arial, sans-serif;margin:0;background:linear-gradient(180deg,#f8fafc 0,#eef2ff 100%);color:var(--text)}
        .header{display:flex;align-items:center;gap:12px;justify-content:center;padding:16px 20px;background:linear-gradient(90deg,var(--dark-bg),#0b1a3a);color:#fff;border-bottom:4px solid var(--primary)}
        .header img{height:36px;width:36px;object-fit:contain}
        .container{max-width:920px;margin:28px auto;padding:16px;display:grid;grid-template-columns:360px 1fr;gap:24px}
        .card{background:var(--card-bg);border-radius:12px;padding:18px;box-shadow:0 10px 25px -10px rgba(2,6,23,.08)}
        .hidden{display:none}
        .login-brand{text-align:center;margin-bottom:12px}
        .login-brand img{width:110px;height:110px;object-fit:cover;border-radius:8px}
        .security-banner{background:#f1f5ff;border-left:4px solid var(--primary);padding:12px;border-radius:8px;margin-bottom:12px;font-size:13px;color:#1e293b}
        input,select,button{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #e6eefb;font-size:15px;background:#fff}
        input:focus,select:focus{outline:none;box-shadow:0 6px 18px rgba(79,70,229,.06);border-color:var(--primary)}
        button{background:var(--primary);color:#fff;border:none;font-weight:700;cursor:pointer;text-transform:none;padding:12px}
        .balanceCard{background:linear-gradient(135deg,#0b1220,#142238);color:#fff;border-radius:12px;padding:18px;position:relative}
        .balance{font-size:34px;font-weight:800}
        .eye{position:absolute;right:16px;top:16px;cursor:pointer;font-size:20px}
        .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
        .action-icon{background:#fff;border-radius:10px;padding:12px;border:1px solid #eef2ff;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-weight:700}
        .action-icon img{width:26px;height:26px;margin-bottom:8px}
        #history{list-style:none;padding:0;margin:0}
        #history li{padding:12px 0;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;font-size:13px}
        .receipt-container{background:#fff;border-radius:12px;overflow:hidden;border:1px solid #e8eefc}
        .receipt-header{background:#fbfdff;padding:18px;text-align:center;border-bottom:1px dashed #e6eefb}
        .receipt-body{padding:14px}
        .receipt-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f8fafc}
        .receipt-row span{color:#64748b}
        .receipt-footer{padding:12px;background:#fbfdff;color:#94a3b8;text-align:center}
        .helpBtn{margin-top:16px;background:var(--dark-bg);color:#fff;border-radius:10px;padding:12px;display:flex;align-items:center;justify-content:center;gap:8px}
        .settings-row{display:flex;gap:8px;align-items:center}
        .muted{color:#64748b;font-size:13px}
        .small{font-size:13px}
        .overlay{position:fixed;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.45);z-index:12000}
        .overlay .card{max-width:420px}
        @media(max-width:900px){.container{grid-template-columns:1fr;padding:12px}}
    </style>
</head>
<body>

<div class="header" id="mainHeader"><img src="File_000000009678724680189a55ffec1a9b.png" alt="GTB logo"><span>GLOBAL TRUST BANK</span></div>

<div class="container">
    <!-- Left: Login -->
    <div>
        <div id="login" class="card">
            <div class="login-brand">
                <img src="File_000000009678724680189a55ffec1a9b.png" alt="Bank logo">
                <h3 id="loginTitle" style="margin:8px 0 0;font-size:18px">Sign in</h3>
            </div>

            <div id="securityBanner" class="security-banner"></div>

            <select id="language" onchange="setLanguage()"></select>

            <!-- Visible salutation selector so user chooses gender/title before login -->
            <select id="genderOverride" style="margin-top:10px">
                <option value="">Auto-detect title</option>
                <option value="male">Mr.</option>
                <option value="female">Ms.</option>
                <option value="other">Prefer not to say</option>
            </select>

            <input type="text" id="username" placeholder="Username" style="margin-top:10px">
            <input type="password" id="password" placeholder="Access PIN" style="margin-top:10px">

            <button id="loginBtn" onclick="doLogin()" style="margin-top:12px">Sign in securely</button>
            <small style="display:block;margin-top:10px;color:#64748b">Secure sign-in — never share your PIN.</small>
        </div>

        <!-- About section removed as requested -->
    </div>

    <!-- Right: Dashboard -->
    <div>
        <div id="dashboard" class="hidden">
            <div class="card balanceCard">
                <div style="display:flex;align-items:center;gap:14px;margin-bottom:12px">
                    <img src="File_000000009678724680189a55ffec1a9b.png" alt="Bank logo" style="width:64px;height:64px;object-fit:cover;border-radius:8px;background:#fff;padding:6px">
                    <div>
                        <div id="greetingText" style="font-size:16px;font-weight:700">Welcome</div>
                        <div id="subGreeting" style="font-size:13px;opacity:.8">Private Wealth • 4402-****-9921</div>
                    </div>
                </div>
                <div class="balance" id="balance">$55,000.00</div>
                <div id="eyeIcon" class="eye" onclick="toggleBalance()">👁️</div>
            </div>

            <div class="grid" style="margin-top:12px">
                <div class="action-icon" onclick="showBox('transferBox')"><img src="https://img.icons8.com/ios-filled/50/4f46e5/forward-arrow.png"><div id="navTransfer">Transfer</div></div>
                <div class="action-icon" onclick="showBox('depositBox')"><img src="https://img.icons8.com/ios-filled/50/4f46e5/plus.png"><div id="navDeposit">Deposit</div></div>
                <div class="action-icon" onclick="showBox('withdrawBox')"><img src="https://img.icons8.com/ios-filled/50/4f46e5/minus.png"><div id="navWithdraw">Withdraw</div></div>
                <div class="action-icon" onclick="location.reload()"><img src="https://img.icons8.com/ios-filled/50/4f46e5/shutdown.png"><div id="navExit">Exit</div></div>
            </div>

            <div id="transferBox" class="card hidden">
                <h4 id="tTitle">Funds Transfer</h4>
                <input id="receiver" placeholder="Beneficiary Name">
                <input id="accountNum" placeholder="Account Number">
                <select id="transferCountry">
                    <option value="" id="selectPlaceholder" disabled selected>Select Destination Country</option>
                </select>
                <input id="bank" placeholder="Bank">
                <input id="amount" type="text" placeholder="Amount ($)" oninput="formatCurrency(this)">
                <button onclick="preTransfer()" id="btnInitiate">Transfer Now</button>
                <div id="transferPreview"></div>
            </div>

            <!-- Other UI sections unchanged -->

        </div>
    </div>
</div>

<script>
// Basic client-side logic (kept minimal and functional)
function setLanguage(){ /* stub - preserved */ }

function showBox(id){
    document.querySelectorAll('.card').forEach(c=>{ if(c.id && c.id!== 'login' && c.id!=='dashboard'){ c.classList.add('hidden'); }});
    const el = document.getElementById(id);
    if(el) el.classList.remove('hidden');
}

function toggleBalance(){
    const b = document.getElementById('balance');
    if(!b) return;
    // Toggle visibility by replacing content with masked form and back
    if(b.dataset.hidden === 'true'){
        b.textContent = b.dataset.value || '$55,000.00';
        b.dataset.hidden = 'false';
    } else {
        // mask
        b.dataset.value = b.textContent;
        b.textContent = '$*****.**';
        b.dataset.hidden = 'true';
    }
}

function doLogin(){
    const user = document.getElementById('username').value.trim();
    if(!user){ alert('Please enter your username'); return; }
    // simple PIN check — keep site functional but no demo text
    const pin = document.getElementById('password').value.trim();
    // accept any non-empty PIN in this front-end demo, but require it
    if(!pin){ alert('Please enter your access PIN'); return; }

    // Prepare greeting
    const gender = document.getElementById('genderOverride').value;
    let title = '';
    if(gender === 'male') title = 'Dear, Mr ';
    else if(gender === 'female') title = 'Dear, Mrs ';
    else title = 'Dear ';
    document.getElementById('greetingText').textContent = title + user + ' — welcome to Shaun Gray charity account';

    // Show dashboard and ensure balance is visible
    document.getElementById('login').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');
    const b = document.getElementById('balance');
    b.textContent = '$55,000.00';
    b.dataset.hidden = 'false';
    b.dataset.value = '$55,000.00';
}

function formatCurrency(inp){
    // basic numeric filter
    const v = inp.value.replace(/[^0-9\.]/g,'');
    inp.value = v;
}

function preTransfer(){
    const receiver = document.getElementById('receiver').value.trim();
    const accountNum = document.getElementById('accountNum').value.trim();
    const amount = document.getElementById('amount').value.trim();
    if(!receiver||!accountNum||!amount){ alert('Please complete transfer details'); return; }
    document.getElementById('transferPreview').innerHTML = '<div class="receipt-container"><div class="receipt-header"><strong>Preview</strong></div><div class="receipt-body"><div class="receipt-row"><span>To</span><b>'+receiver+'</b></div><div class="receipt-row"><span>Account</span><b>'+accountNum+'</b></div><div class="receipt-row"><span>Amount</span><b>$'+amount+'</b></div></div></div><div style="margin-top:10px"><button onclick="confirmTransfer()">Confirm Transfer</button></div>';
}

function confirmTransfer(){
    // Basic confirmation — deduct amount from shown balance
    const amountStr = document.getElementById('amount').value.replace(/[^0-9\.]/g,'');
    const amount = parseFloat(amountStr) || 0;
    const balEl = document.getElementById('balance');
    const current = parseFloat((balEl.dataset.value || balEl.textContent).replace(/[^0-9\.]/g,'')) || 0;
    const newBal = Math.max(0, current - amount);
    balEl.dataset.value = '$' + newBal.toFixed(2);
    balEl.textContent = '$' + newBal.toFixed(2);
    document.getElementById('transferPreview').innerHTML = '<div class="receipt-container"><div class="receipt-header"><strong>Success</strong></div><div class="receipt-body"><div class="receipt-row"><span>New balance</span><b>$'+newBal.toFixed(2)+'</b></div></div></div>';
}
</script>

</body>
</html>
